<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Versions — Shaima Alrewaished</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1512; --card:rgba(255,235,220,0.05); --border:rgba(255,226,208,0.14); --border-hover:rgba(224,160,138,0.6);
  --text:#f4e8de; --text-dim:#b8a79b; --text-faint:#7d6d63;
  --accent1:#e0a08a; --accent3:#a9b99f; --sage-soft:rgba(169,185,159,0.16); --ink:#1c1512;
  --serif:'Cormorant Garamond',serif; --shadow:0 30px 60px -30px rgba(0,0,0,.6);
}
html[data-theme="light"]{
  --bg:#f8eee7; --card:#fcf6f1; --border:#e8d8cc; --border-hover:#c98672;
  --text:#3b2a25; --text-dim:#7b6a62; --text-faint:#a8968c;
  --accent1:#c4785f; --accent3:#7f9477; --sage-soft:#dfe3d3; --ink:#fffaf6;
  --shadow:0 30px 60px -30px rgba(120,70,50,.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:17px;line-height:1.7;overflow-x:hidden;transition:background .4s,color .4s;}
html[data-lang="ar"] body{font-family:'Cairo',sans-serif;}
html[data-lang="ar"] body *{letter-spacing:0 !important;}
a{color:inherit;text-decoration:none;}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:radial-gradient(circle,rgba(196,120,95,.12) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse 80% 60% at 50% 20%,#000 20%,transparent 85%);}
.blob{position:fixed;z-index:-1;border-radius:58% 42% 55% 45%/48% 56% 44% 52%;filter:blur(2px);animation:morph 16s ease-in-out infinite;}
.b1{width:480px;height:480px;background:var(--sage-soft);top:-120px;inset-inline-end:-140px;opacity:.9;}
.b2{width:360px;height:360px;background:color-mix(in srgb,var(--accent1) 18%,transparent);bottom:-100px;inset-inline-start:-100px;animation-delay:-6s;}
@keyframes morph{50%{border-radius:44% 56% 42% 58%/56% 44% 56% 44%;transform:translate(20px,-20px);}}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px;}

/* nav */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
.logo{font-family:var(--serif);font-style:italic;font-weight:600;font-size:24px;}
.ctrls{display:flex;gap:10px;}
.cbtn{height:38px;min-width:38px;padding:0 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font:700 12px 'DM Sans',sans-serif;transition:.25s;display:flex;align-items:center;justify-content:center;}
.cbtn:hover{border-color:var(--border-hover);transform:translateY(-2px);}

/* hero */
.hero{padding:70px 0 40px;text-align:center;}
.kicker{display:inline-block;font-size:12.5px;letter-spacing:3px;font-weight:600;padding-bottom:6px;margin-bottom:22px;border-bottom:2px solid var(--accent1);text-transform:uppercase;}
html[data-lang="ar"] .kicker{font-size:15px;text-transform:none;}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(52px,9vw,124px);line-height:.98;text-transform:uppercase;letter-spacing:1px;}
.hero h1 em{display:block;color:var(--accent1);font-style:italic;text-transform:none;}
html[data-lang="ar"] .hero h1{line-height:1.3;text-transform:none;font-size:clamp(44px,7.5vw,92px);}
html[data-lang="ar"] .hero h1 em{font-style:normal;}
.hero p{max-width:560px;margin:26px auto 0;color:var(--text-dim);font-size:18.5px;line-height:1.9;}

/* versions */
.versions{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:50px 0 30px;align-items:start;}
@media(max-width:900px){.versions{grid-template-columns:1fr;gap:56px;}}
.ver{display:flex;flex-direction:column;gap:20px;}
.ver.v2{margin-top:46px;}
@media(max-width:900px){.ver.v2{margin-top:0;}}
.ver-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
.ver-no{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--accent1);line-height:1;}
.ver-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.4vw,52px);line-height:1;}
html[data-lang="ar"] .ver-head h2{line-height:1.3;}
.pill{font-size:11px;font-weight:700;letter-spacing:1.5px;padding:5px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent3) 45%,transparent);background:color-mix(in srgb,var(--accent3) 16%,transparent);color:var(--accent3);text-transform:uppercase;}
.v1 .pill{border-color:var(--border);background:transparent;color:var(--text-faint);}
html[data-lang="ar"] .pill{text-transform:none;font-size:13px;}
.ver-desc{color:var(--text-dim);font-size:16.5px;line-height:1.85;max-width:520px;}

/* browser frame with live preview */
.frame{position:relative;border-radius:22px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);overflow:hidden;transition:transform .45s cubic-bezier(.3,1.2,.5,1),border-color .3s;display:block;direction:ltr;}
.v1 .frame{transform:rotate(-1.4deg);}
.v2 .frame{transform:rotate(1.2deg);}
.ver:hover .frame{transform:rotate(0) translateY(-8px);border-color:var(--border-hover);}
.bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--border);}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--border);}
.bar i:nth-child(1){background:#c4785f;}.bar i:nth-child(2){background:#d9a441;}.bar i:nth-child(3){background:#7f9477;}
.bar span{margin-inline-start:auto;font-size:12px;color:var(--text-faint);font-family:ui-monospace,Menlo,monospace;}
.screen{position:relative;aspect-ratio:16/11;overflow:hidden;background:#fff;}
.screen iframe{position:absolute;top:0;left:0;width:1440px;height:990px;border:0;transform-origin:0 0;pointer-events:none;}
.screen .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 0%,transparent);transition:.3s;}
.ver:hover .veil{background:rgba(28,21,18,.38);}
.veil b{opacity:0;transform:translateY(10px);transition:.3s;background:var(--accent1);color:var(--ink);padding:12px 24px;border-radius:999px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;}
html[data-lang="ar"] .veil b{text-transform:none;font-size:15px;}
.ver:hover .veil b{opacity:1;transform:none;}

.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:999px;font-weight:600;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--border);transition:.3s;align-self:flex-start;}
html[data-lang="ar"] .btn{text-transform:none;font-size:15px;}
.btn svg{width:16px;height:16px;}
html[dir="rtl"] .btn svg{transform:scaleX(-1);}
.btn-primary{background:var(--accent1);color:var(--ink);border-color:transparent;}
.btn:hover{transform:translateY(-3px);border-color:var(--border-hover);}

/* what changed */
section.changes{padding:90px 0 60px;}
.sec-head{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:10px;}
.sec-num{font-size:12px;letter-spacing:3px;color:var(--accent1);font-weight:700;}
.sec-head h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(34px,5vw,58px);line-height:1;}
html[data-lang="ar"] .sec-head h2{font-style:normal;line-height:1.3;}
.row{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--border);align-items:baseline;transition:padding .3s;}
.row:hover:not(.row-head){padding-inline-start:12px;}
.row-head{padding:22px 0 14px;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--text-faint);}
html[data-lang="ar"] .row-head{font-size:14px;letter-spacing:0;text-transform:none;}
.row .what{font-family:var(--serif);font-size:clamp(24px,2.4vw,32px);font-weight:600;line-height:1.2;}
html[data-lang="ar"] .row .what{font-size:21px;line-height:1.5;}
.row .a{color:var(--text-faint);font-size:15.5px;}
.row .b{color:var(--text-dim);font-size:15.5px;}
.row .b::before{content:"✦ ";color:var(--accent1);}
@media(max-width:760px){.row{grid-template-columns:1fr;gap:6px;}.row-head{display:none;}}

footer{padding:60px 0 50px;text-align:center;color:var(--text-faint);font-size:14px;}
footer b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--accent1);display:block;margin-bottom:6px;}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease;}
.reveal.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){.blob{animation:none;}.reveal{opacity:1;transform:none;transition:none;}.frame{transition:none;}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<div class="wrap">
  <header class="top">
    <a href="#" class="logo" data-i="logo">Shaima Alrewaished</a>
    <div class="ctrls">
      <button class="cbtn" id="langBtn">AR</button>
      <button class="cbtn" id="themeBtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="versions">
    <article class="ver v1 reveal">
      <div class="ver-head"><span class="ver-no">01</span><h2 data-i="v1t">The first draft</h2><span class="pill" data-i="v1p">Version 1</span></div>
      <a class="frame" data-ver="v1" href="v1.html" aria-label="Open version 1">
        <div class="bar"><i></i><i></i><i></i><span data-ver-label="v1">v1.html</span></div>
        <div class="screen"><iframe data-ver="v1" src="v1.html" title="Version 1 preview" loading="lazy" tabindex="-1"></iframe><div class="veil"><b data-i="open">Open it</b></div></div>
      </a>
      <a class="btn" data-ver="v1" href="v1.html"><span data-i="v1b">See version 1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </article>

    <article class="ver v2 reveal">
      <div class="ver-head"><span class="ver-no">02</span><h2 data-i="v2t">The final one</h2><span class="pill" data-i="v2p">Live · Version 2</span></div>
      <a class="frame" data-ver="v2" href="v2.html" aria-label="Open version 2">
        <div class="bar"><i></i><i></i><i></i><span data-ver-label="v2">v2.html</span></div>
        <div class="screen"><iframe data-ver="v2" src="v2.html" title="Version 2 preview" loading="lazy" tabindex="-1"></iframe><div class="veil"><b data-i="open">Open it</b></div></div>
      </a>
      <a class="btn btn-primary" data-ver="v2" href="v2.html"><span data-i="v2b">See version 2</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </article>
  </div>

  <footer><b data-i="fb">Shaima Alrewaished</b><span data-i="ft">AI Engineer · Riyadh</span></footer>
</div>

<script>
/* ===== file names of the two versions: change them here only ===== */
const FILES={v1:"v1.html",v2:"v2.html"};
document.querySelectorAll("[data-ver]").forEach(e=>{const f=FILES[e.dataset.ver];if(e.tagName==="IFRAME")e.src=f;else e.href=f;});
document.querySelectorAll("[data-ver-label]").forEach(e=>e.textContent=FILES[e.dataset.verLabel]);
const T={
en:{logo:"Shaima Alrewaished",
v1t:"The first draft",v1p:"Version 1",v1b:"See version 1",
v2t:"The final one",v2p:"Live · Version 2",v2b:"See version 2",open:"Open it",
fb:"Shaima Alrewaished",ft:"AI Engineer · Riyadh"},
ar:{logo:"شيماء الرويشد",
v1t:"المسودة الأولى",v1p:"النسخة ١",v1b:"شوف النسخة ١",
v2t:"النسخة النهائية",v2p:"منشورة · النسخة ٢",v2b:"شوف النسخة ٢",open:"افتحها",
fb:"شيماء الرويشد",ft:"مهندسة ذكاء اصطناعي · الرياض"}};
let lang="en";
function setLang(l){
  lang=l;const h=document.documentElement;
  h.setAttribute("lang",l);h.setAttribute("dir",l==="ar"?"rtl":"ltr");h.setAttribute("data-lang",l);
  document.getElementById("langBtn").textContent=l==="ar"?"EN":"AR";
  document.querySelectorAll("[data-i]").forEach(e=>{const v=T[l][e.dataset.i];if(v)e.textContent=v;});
  try{localStorage.setItem("versions-lang",l);}catch(e){}
}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("versions-theme",t);}catch(e){}}
document.getElementById("langBtn").onclick=()=>setLang(lang==="en"?"ar":"en");
document.getElementById("themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

/* scale the live previews to fit their frames */
function fit(){document.querySelectorAll(".screen").forEach(s=>{const f=s.querySelector("iframe");f.style.transform="scale("+(s.clientWidth/1440)+")";});}
new ResizeObserver(fit).observe(document.body);window.addEventListener("load",fit);fit();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in");}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(e=>io.observe(e));

let sl="en",st="light";
try{sl=localStorage.getItem("versions-lang")||"en";st=localStorage.getItem("versions-theme")||"light";}catch(e){}
setTheme(st);setLang(sl);
</script>
</body>
</html>
